# Magec - OpenAI cloud deployment
# Uses OpenAI APIs for LLM, STT, TTS and embeddings. Only Redis and PostgreSQL run locally.
# Requires: OPENAI_API_KEY environment variable.
#
# Usage:
#   cp config.yaml.example config.yaml
#   export OPENAI_API_KEY=sk-...
#   docker compose up -d

services:
  magec:
    image: ghcr.io/achetronic/magec:latest
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./config.yaml:/app/config.yaml
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: magec
      POSTGRES_PASSWORD: magec
      POSTGRES_DB: magec
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
