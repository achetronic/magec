# Magec - Base services
# Use with an override: cp docker-compose.{local,openai,...}.yaml docker-compose.override.yaml

services:
  magec:
    image: ghcr.io/achetronic/magec:latest
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./config.yaml:/app/config.yaml
      - magec_data:/app/data
    depends_on:
      ollama-setup:
        condition: service_completed_successfully
      redis:
        condition: service_started
      postgres:
        condition: service_started
      parakeet:
        condition: service_started
      tts:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: magec
      POSTGRES_PASSWORD: magec
      POSTGRES_DB: magec
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ollama-setup:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama to be ready..."
        until curl -sf http://ollama:11434/api/tags > /dev/null 2>&1; do
          sleep 2
        done
        echo "Pulling nomic-embed-text (embeddings)..."
        curl -sf http://ollama:11434/api/pull -d '{"name":"nomic-embed-text"}' > /dev/null
        echo "Models ready."

  parakeet:
    image: ghcr.io/achetronic/parakeet:latest
    restart: unless-stopped

  tts:
    image: travisvn/openai-edge-tts:latest
    environment:
      - API_KEY=sk-unused
    restart: unless-stopped

volumes:
  magec_data:
  redis_data:
  postgres_data:
  ollama_data:
