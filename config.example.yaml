server:
  host: 0.0.0.0 # Use 127.0.0.1 to restrict to localhost only
  port: 8080

log:
  level: info # debug, info, warn, error
  format: console # console, json

# Reusable AI backends
backends:
  # LLM backends
  - name: ollama
    type: openai
    url: http://localhost:11434/v1

  # - name: openai-cloud
  #   type: openai
  #   apiKey: ${OPENAI_API_KEY}

  # - name: anthropic-cloud
  #   type: anthropic
  #   apiKey: ${ANTHROPIC_API_KEY}

  # - name: gemini-cloud
  #   type: gemini
  #   apiKey: ${GEMINI_API_KEY}

  # Transcription backends (OpenAI Whisper-compatible)
  - name: local-whisper
    type: openai
    url: http://127.0.0.1:5092/v1

  # TTS backends (OpenAI TTS-compatible)
  # - name: openai-tts
  #   type: openai
  #   apiKey: ${OPENAI_API_KEY}

  # - name: edge-tts
  #   type: openai
  #   url: http://localhost:5050/v1
  #   apiKey: "required-dummy-apikey"

# Wake word detection (server-side)
wakeWord:
  enabled: false

# Transcription settings
# Requires OpenAI-compatible Whisper backend (OpenAI, faster-whisper, Parakeet)
# See: https://github.com/achetronic/parakeet
# See: https://github.com/fedirz/faster-whisper-server
transcription:
  backend: local-whisper
  model: whisper-1

# LLM settings
llm:
  backend: ollama
  model: qwen3:8b

# Agent configuration
# agent:
#   # Override the default system prompt entirely
#   systemPrompt: |
#     You are a custom voice assistant.
#     Respond briefly and naturally.
#   # Or append additional context to the default prompt
#   systemPromptSuffix: |
#     Additional instructions for your specific use case.

# TTS settings (optional)
# Requires OpenAI-compatible TTS backend (OpenAI, edge-tts, chatterbox)
# See: https://github.com/travisvn/openai-edge-tts
# See: https://github.com/travisvn/chatterbox-tts-api
# tts:
#   backend: openai-cloud  # or edge-tts
#   model: tts-1
#   voice: alloy           # alloy, echo, fable, onyx, nova, shimmer
#   speed: 1.0             # 0.25 to 4.0

# Memory configuration
memory:
  session:
    redis:
      address: localhost:6379
      password: ""
      db: 0
      ttl: 24h

  longTerm:
    embedding:
      backend: ollama
      model: nomic-embed-text

    postgres:
      connectionString: postgres://postgres:postgres@localhost:5432/magec?sslmode=disable

# MCP tool servers
mcpServers:
  # HTTP transport (default)
  # - name: filesystem
  #   type: http  # optional, http is default
  #   endpoint: http://localhost:8080/mcp
  #   systemPrompt: |
  #     This MCP provides filesystem access. Use it to read and write files.
  #
