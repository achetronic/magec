  #   endpoint: https://mcp-github.example.com/mcp
  #   headers:
  #     Authorization: Bearer ${GITHUB_TOKEN}
  #   systemPrompt: |
  #     This MCP provides GitHub integration for repository management.
  #
  # Stdio transport (subprocess)
