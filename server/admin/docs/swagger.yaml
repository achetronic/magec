basePath: /api/v1/admin
definitions:
  admin.ClientTypeInfo:
    properties:
      configSchema:
        $ref: '#/definitions/client.Schema'
      displayName:
        example: Telegram
        type: string
      type:
        example: telegram
        type: string
    type: object
  admin.ErrorResponse:
    properties:
      error:
        example: resource not found
        type: string
    type: object
  client.Schema:
    additionalProperties: true
    type: object
  store.ClientConfig:
    properties:
      cron:
        $ref: '#/definitions/store.CronClientConfig'
      discord:
        $ref: '#/definitions/store.DiscordClientConfig'
      slack:
        $ref: '#/definitions/store.SlackClientConfig'
      telegram:
        $ref: '#/definitions/store.TelegramClientConfig'
      webhook:
        $ref: '#/definitions/store.WebhookClientConfig'
    type: object
  store.ClientDefinition:
    properties:
      allowedAgents:
        items:
          type: string
        type: array
      config:
        $ref: '#/definitions/store.ClientConfig'
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      token:
        type: string
      type:
        type: string
    type: object
  store.CronClientConfig:
    properties:
      commandId:
        type: string
      schedule:
        type: string
    type: object
  store.DiscordClientConfig:
    properties:
      allowedChannels:
        items:
          type: string
        type: array
      allowedUsers:
        items:
          type: string
        type: array
      botToken:
        type: string
      guildId:
        type: string
    type: object
  store.SlackClientConfig:
    properties:
      allowedChannels:
        items:
          type: string
        type: array
      allowedUsers:
        items:
          type: string
        type: array
      botToken:
        type: string
      signingSecret:
        type: string
    type: object
  store.TelegramClientConfig:
    properties:
      allowedChats:
        items:
          type: integer
        type: array
      allowedUsers:
        items:
          type: integer
        type: array
      botToken:
        type: string
      responseMode:
        type: string
    type: object
  store.WebhookClientConfig:
    properties:
      commandId:
        type: string
      passthrough:
        type: boolean
    type: object
host: localhost:8081
info:
  contact: {}
  description: Administration API for managing Magec multi-agent voice assistant resources.
  title: Magec Admin API
  version: "1.0"
paths:
  /clients:
    get:
      description: Returns all configured clients (devices, Telegram bots, etc.)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.ClientDefinition'
            type: array
      summary: List clients
      tags:
      - clients
    post:
      consumes:
      - application/json
      description: Creates a new client. A unique auth token is generated automatically.
      parameters:
      - description: Client definition (token is auto-generated)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/store.ClientDefinition'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/store.ClientDefinition'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      summary: Create client
      tags:
      - clients
  /clients/{id}:
    delete:
      description: Deletes a client by ID, revoking its access token
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      summary: Delete client
      tags:
      - clients
    get:
      description: Returns a client by its unique ID
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.ClientDefinition'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      summary: Get client
      tags:
      - clients
    put:
      consumes:
      - application/json
      description: Updates a client by ID. Token and ID are preserved.
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      - description: Client definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/store.ClientDefinition'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.ClientDefinition'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      summary: Update client
      tags:
      - clients
  /clients/{id}/regenerate-token:
    post:
      description: Generates a new authentication token for a client, invalidating
        the previous one
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.ClientDefinition'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      summary: Regenerate client token
      tags:
      - clients
  /clients/types:
    get:
      description: Returns registered client types with config field specifications
        for dynamic form rendering
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/admin.ClientTypeInfo'
            type: array
      summary: List client types
      tags:
      - clients
schemes:
- http
swagger: "2.0"
