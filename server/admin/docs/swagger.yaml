        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      summary: Update MCP server
      tags:
      - mcps
  /memory:
    get:
      description: Returns all configured memory providers (session and long-term)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.MemoryProvider'
            type: array
      summary: List memory providers
      tags:
      - memory
    post:
      consumes:
      - application/json
      description: Creates a new memory provider. Type must be registered and support
        the given category.
      parameters:
      - description: Memory provider definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/store.MemoryProvider'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/store.MemoryProvider'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      summary: Create memory provider
      tags:
      - memory
  /memory/{name}:
    delete:
      description: Deletes a memory provider by name
      parameters:
      - description: Provider name
        in: path
        name: name
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
