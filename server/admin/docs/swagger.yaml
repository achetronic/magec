        name: name
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      summary: Delete backend
      tags:
      - backends
    get:
      description: Returns a backend by its unique name
      parameters:
      - description: Backend name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.BackendDefinition'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      summary: Get backend
      tags:
      - backends
    put:
      consumes:
      - application/json
      description: Updates a backend by name
      parameters:
      - description: Backend name
        in: path
        name: name
        required: true
        type: string
      - description: Backend definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/store.BackendDefinition'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.BackendDefinition'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      summary: Update backend
      tags:
      - backends
  /crons:
    get:
      description: Returns all configured scheduled tasks
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.CronJob'
            type: array
      summary: List cron jobs
      tags:
      - crons
    post:
      consumes:
      - application/json
      description: Creates a new scheduled task that sends a prompt to an agent
      parameters:
      - description: Cron job definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/store.CronJob'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/store.CronJob'
        "400":
