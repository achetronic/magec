          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      summary: Update memory provider
      tags:
      - memory
  /memory/{name}/health:
    get:
      description: Pings the memory provider with a 5-second timeout to verify connectivity
      parameters:
      - description: Provider name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/memory.HealthResult'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      summary: Health check
      tags:
      - memory
  /memory/types:
    get:
      description: Returns registered provider types with supported categories and
        config field specifications for dynamic form rendering
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/admin.MemoryTypeInfo'
            type: array
      summary: List memory provider types
      tags:
      - memory
  /overview:
    get:
      description: Returns counts for all resource types and agent summaries
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Dashboard overview
      tags:
      - overview
schemes:
- http
swagger: "2.0"
