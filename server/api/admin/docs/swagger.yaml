          $ref: '#/definitions/admin.SecretUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.SecretResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      security:
      - AdminAuth: []
      summary: Update secret
      tags:
      - secrets
  /settings:
    get:
      description: Returns the global settings (session provider, long-term memory
        provider).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.Settings'
      security:
      - AdminAuth: []
      summary: Get settings
      tags:
      - settings
    put:
      consumes:
      - application/json
      description: Replaces the global settings. Changes take effect on next agent
        rebuild.
      parameters:
      - description: New settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/store.Settings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.Settings'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      security:
      - AdminAuth: []
      summary: Update settings
      tags:
      - settings
  /settings/backup:
    get:
      description: Streams a .tar.gz archive containing the entire data directory
        (store.json, conversations.json, skills files).
      produces:
      - application/gzip
      responses:
        "200":
          description: Backup archive
          schema:
            type: file
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      security:
      - AdminAuth: []
      summary: Download backup
      tags:
      - backup
  /settings/restore:
    post:
      consumes:
      - application/gzip
      description: Accepts a .tar.gz archive (max 500MB) and atomically replaces the
        entire data directory. The archive must contain a valid store.json at the
        root level. After extraction, both the main store and conversation store are
        reloaded in memory.
      parameters:
      - description: Backup .tar.gz archive
        in: body
        name: body
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: 'status: restored'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      security:
      - AdminAuth: []
      summary: Restore from backup
      tags:
      - backup
  /skills:
    get:
      description: Returns all configured skills with their on-disk metadata
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/admin.SkillSummary'
            type: array
      security:
      - AdminAuth: []
      summary: List skills
      tags:
      - skills
  /skills/{id}:
    delete:
      description: Deletes a skill and its on-disk package
      parameters:
      - description: Skill ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      security:
      - AdminAuth: []
      summary: Delete skill
      tags:
      - skills
    get:
      description: Returns a skill with its on-disk frontmatter, instructions and
        resources
      parameters:
      - description: Skill ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.SkillView'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      security:
      - AdminAuth: []
      summary: Get skill
      tags:
      - skills
  /skills/{id}/download:
    get:
      description: Streams the skill's on-disk directory as a tar.gz archive
      parameters:
      - description: Skill ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/gzip
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      security:
      - AdminAuth: []
      summary: Download skill package
      tags:
      - skills
  /skills/upload:
    post:
      consumes:
      - multipart/form-data
      description: Creates or replaces a skill from a SKILL.md or a .zip/.tar.gz package
      parameters:
      - description: SKILL.md, .zip or .tar.gz
        in: formData
        name: file
        required: true
        type: file
      - description: Overwrite if a skill with the same slug already exists
        in: query
        name: replace
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.SkillView'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.SkillView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      security:
      - AdminAuth: []
      summary: Upload a skill
      tags:
      - skills
  /voice/types:
    get:
      description: Returns registered voice providers with config schemas for dynamic
        form rendering. The backend type determines which voice provider handles TTS/STT
        requests.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/admin.VoiceProviderInfo'
            type: array
      security:
      - AdminAuth: []
      summary: List voice provider types
      tags:
      - voice
schemes:
- http
securityDefinitions:
  AdminAuth:
    description: Enter "Bearer {adminPassword}" to authenticate. Only required when
      server.adminPassword is set.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
