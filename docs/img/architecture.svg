    <!-- Main card -->
    <rect x="0" y="0" width="280" height="280" rx="20" fill="url(#cardGradient)" filter="url(#shadow)"/>
    <rect x="0" y="0" width="280" height="280" rx="20" fill="none" stroke="url(#sunGradient)" stroke-width="2"/>
    
    <!-- Sun logo -->
    <circle cx="140" cy="40" r="22" fill="url(#sunGradient)" filter="url(#glow)"/>
    <circle cx="133" cy="33" r="3" fill="#fff" opacity="0.6"/>
    <circle cx="148" cy="47" r="2" fill="#fff" opacity="0.4"/>
    <circle cx="130" cy="45" r="2.5" fill="#fff" opacity="0.5"/>
    
    <!-- Title -->
    <text x="140" y="82" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Magec Server</text>
    
    <!-- Processing components -->
    <!-- STT -->
    <g transform="translate(20, 100)">
      <rect x="0" y="0" width="115" height="50" rx="8" fill="#2a2a2f"/>
      <circle cx="22" cy="25" r="12" fill="#38bcd8" opacity="0.2"/>
      <text x="22" y="30" text-anchor="middle" fill="#38bcd8" font-size="14">🎤</text>
      <text x="70" y="20" text-anchor="middle" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="10">Speech to Text</text>
      <text x="70" y="35" text-anchor="middle" fill="#78716c" font-family="system-ui, sans-serif" font-size="9">Whisper</text>
    </g>
    
    <!-- AI Agent -->
    <g transform="translate(145, 100)">
      <rect x="0" y="0" width="115" height="50" rx="8" fill="#2a2a2f"/>
      <circle cx="22" cy="25" r="12" fill="#a78bfa" opacity="0.2"/>
      <text x="22" y="30" text-anchor="middle" fill="#a78bfa" font-size="14">🧠</text>
      <text x="70" y="20" text-anchor="middle" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="10">AI Agent</text>
      <text x="70" y="35" text-anchor="middle" fill="#78716c" font-family="system-ui, sans-serif" font-size="9">+ Memory</text>
    </g>
    
    <!-- TTS -->
    <g transform="translate(20, 165)">
      <rect x="0" y="0" width="115" height="50" rx="8" fill="#2a2a2f"/>
      <circle cx="22" cy="25" r="12" fill="#4ade80" opacity="0.2"/>
      <text x="22" y="30" text-anchor="middle" fill="#4ade80" font-size="14">🔊</text>
      <text x="70" y="20" text-anchor="middle" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="10">Text to Speech</text>
      <text x="70" y="35" text-anchor="middle" fill="#78716c" font-family="system-ui, sans-serif" font-size="9">Optional</text>
    </g>
    
    <!-- Wake Word -->
    <g transform="translate(145, 165)">
      <rect x="0" y="0" width="115" height="50" rx="8" fill="#2a2a2f"/>
      <circle cx="22" cy="25" r="12" fill="#f59e0b" opacity="0.2"/>
      <text x="22" y="30" text-anchor="middle" fill="#fbbf24" font-size="14">👂</text>
      <text x="70" y="20" text-anchor="middle" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="10">Wake Word</text>
      <text x="70" y="35" text-anchor="middle" fill="#78716c" font-family="system-ui, sans-serif" font-size="9">Optional</text>
    </g>
    
    <!-- Memory indicators -->
    <g transform="translate(20, 230)">
      <!-- Left section: Memory label -->
      <rect x="0" y="0" width="60" height="35" rx="8" fill="#2e2e33"/>
      <rect x="52" y="0" width="8" height="35" fill="#2e2e33"/>
      <!-- Right section: Redis + PostgreSQL -->
      <rect x="60" y="0" width="180" height="35" rx="8" fill="#2a2a2f"/>
      <rect x="60" y="0" width="8" height="35" fill="#2a2a2f"/>
      <!-- Divider line -->
      <line x1="60" y1="0" x2="60" y2="35" stroke="#2e2e33" stroke-width="1"/>
      <!-- Text -->
      <text x="30" y="22" text-anchor="middle" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="10" font-weight="500">Memory</text>
      <text x="105" y="22" text-anchor="middle" fill="#78716c" font-family="system-ui, sans-serif" font-size="10">📦 Redis</text>
      <text x="175" y="22" text-anchor="middle" fill="#78716c" font-family="system-ui, sans-serif" font-size="10">🐘 PostgreSQL</text>
    </g>
