  <!-- LLM PROVIDERS (Top Right) -->
  <g transform="translate(640, 70)">
    <rect x="0" y="0" width="200" height="150" rx="16" fill="url(#cardGradient)" filter="url(#shadow)"/>
    <rect x="0" y="0" width="200" height="150" rx="16" fill="none" stroke="#3d3d44" stroke-width="1"/>
    
    <text x="100" y="28" text-anchor="middle" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="600">🤖 LLM Providers</text>
    
    <!-- Provider pills -->
    <rect x="15" y="45" width="80" height="24" rx="12" fill="#2a2a2f"/>
    <text x="55" y="62" text-anchor="middle" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="10">OpenAI</text>
    
    <rect x="105" y="45" width="80" height="24" rx="12" fill="#2a2a2f"/>
    <text x="145" y="62" text-anchor="middle" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="10">Anthropic</text>
    
    <rect x="15" y="78" width="80" height="24" rx="12" fill="#2a2a2f"/>
    <text x="55" y="95" text-anchor="middle" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="10">Gemini</text>
    
    <rect x="105" y="78" width="80" height="24" rx="12" fill="#2a2a2f"/>
    <text x="145" y="95" text-anchor="middle" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="10">Ollama</text>
    
    <text x="100" y="125" text-anchor="middle" fill="#78716c" font-family="system-ui, sans-serif" font-size="9" font-style="italic">+ any OpenAI-compatible</text>
    <text x="100" y="140" text-anchor="middle" fill="#78716c" font-family="system-ui, sans-serif" font-size="9" font-style="italic">API</text>
  </g>
  
  <!-- MCP TOOLS (Bottom Right) -->
  <g transform="translate(640, 260)">
    <rect x="0" y="0" width="200" height="150" rx="16" fill="url(#cardGradient)" filter="url(#shadow)"/>
    <rect x="0" y="0" width="200" height="150" rx="16" fill="none" stroke="#3d3d44" stroke-width="1"/>
    
    <text x="100" y="28" text-anchor="middle" fill="#4ade80" font-family="system-ui, sans-serif" font-size="12" font-weight="600">🔧 MCP Tools</text>
    
    <!-- Tool pills -->
    <rect x="15" y="45" width="85" height="24" rx="12" fill="#2a2a2f"/>
    <text x="57" y="62" text-anchor="middle" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="10">🏠 Home</text>
    
    <rect x="110" y="45" width="75" height="24" rx="12" fill="#2a2a2f"/>
    <text x="147" y="62" text-anchor="middle" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="10">📁 Files</text>
    
    <rect x="15" y="78" width="80" height="24" rx="12" fill="#2a2a2f"/>
    <text x="55" y="95" text-anchor="middle" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="10">🐙 GitHub</text>
    
    <rect x="105" y="78" width="80" height="24" rx="12" fill="#2a2a2f"/>
    <text x="145" y="95" text-anchor="middle" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="10">🗄️ SQLite</text>
    
    <text x="100" y="125" text-anchor="middle" fill="#78716c" font-family="system-ui, sans-serif" font-size="9" font-style="italic">Connect any MCP</text>
    <text x="100" y="140" text-anchor="middle" fill="#78716c" font-family="system-ui, sans-serif" font-size="9" font-style="italic">compatible service</text>
  </g>
  
  <!-- Arrows: Magec to LLMs -->
  <g>
    <path d="M 570 190 C 600 190, 620 145, 640 145" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
    <circle cx="640" cy="145" r="3" fill="#a78bfa"/>
  </g>
  
  <!-- Arrows: Magec to Tools -->
  <g>
    <path d="M 570 290 C 600 290, 620 335, 640 335" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.6"/>
    <circle cx="640" cy="335" r="3" fill="#4ade80"/>
  </g>
  
  <!-- Arrow: Magec back to Interfaces -->
  <g>
    <path d="M 290 280 C 250 300, 220 300, 190 280" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  </g>
  
  <!-- Bottom tagline -->
  <text x="450" y="490" text-anchor="middle" fill="#52525b" font-family="system-ui, sans-serif" font-size="12">All processing happens on your server • Your assistant, your data, your control</text>
</svg>
