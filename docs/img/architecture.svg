<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1d"/>
      <stop offset="100%" style="stop-color:#121214"/>
    </linearGradient>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2f"/>
      <stop offset="100%" style="stop-color:#212125"/>
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bcd8"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="520" fill="url(#bgGradient)"/>
  
  <!-- Decorative dots -->
  <circle cx="50" cy="50" r="1.5" fill="#3d3d44" opacity="0.5"/>
  <circle cx="100" cy="80" r="1" fill="#3d3d44" opacity="0.3"/>
  <circle cx="850" cy="470" r="1.5" fill="#3d3d44" opacity="0.5"/>
  <circle cx="800" cy="440" r="1" fill="#3d3d44" opacity="0.3"/>
  <circle cx="750" cy="60" r="1.2" fill="#3d3d44" opacity="0.4"/>
  
  <!-- INTERFACES SECTION (Left) -->
  <g transform="translate(40, 90)">
    <!-- Interfaces card -->
    <rect x="0" y="0" width="140" height="300" rx="16" fill="url(#cardGradient)" filter="url(#shadow)"/>
    <rect x="0" y="0" width="140" height="300" rx="16" fill="none" stroke="#3d3d44" stroke-width="1"/>
    
    <text x="70" y="28" text-anchor="middle" fill="#38bcd8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Interfaces</text>
    
    <!-- Web -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="110" height="50" rx="8" fill="#2a2a2f"/>
      <!-- Magec logo -->
      <g transform="translate(10, 13)">
        <defs>
          <linearGradient id="magecLogoGradient" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#f87171"/>
          </linearGradient>
        </defs>
        <circle cx="12" cy="12" r="10" fill="url(#magecLogoGradient)"/>
        <circle cx="7" cy="9" r="1.2" fill="white" opacity="0.9"/>
        <circle cx="10" cy="6" r="0.9" fill="white" opacity="0.7"/>
        <circle cx="15" cy="8" r="1" fill="white" opacity="0.8"/>
        <circle cx="17" cy="12" r="0.7" fill="white" opacity="0.6"/>
        <circle cx="14" cy="15" r="1.1" fill="white" opacity="0.75"/>
        <circle cx="9" cy="16" r="0.8" fill="white" opacity="0.65"/>
      </g>
      <text x="68" y="20" text-anchor="middle" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="11">Web</text>
      <text x="68" y="35" text-anchor="middle" fill="#78716c" font-family="system-ui, sans-serif" font-size="9">Voice + Text</text>
    </g>
    
    <!-- Telegram -->
    <g transform="translate(15, 105)">
      <rect x="0" y="0" width="110" height="50" rx="8" fill="#2a2a2f"/>
      <!-- Telegram logo - proper paper plane -->
      <g transform="translate(10, 13)">
        <circle cx="12" cy="12" r="10" fill="#29a9eb"/>
        <path d="M6 12.5l2.8 1 1 3.2c.1.3.4.3.6.1l1.4-1.2 2.8 2c.3.2.6 0 .7-.3l1.7-9c.1-.4-.2-.6-.5-.5l-10 4c-.4.1-.4.5-.1.6l2.6 1z" fill="#fff"/>
        <path d="M9.5 13l4.5-3" fill="none" stroke="#29a9eb" stroke-width="0.6"/>
        <path d="M9.5 13l.8 2.5.5-1.8" fill="#c8e6f8"/>
      </g>
      <text x="68" y="20" text-anchor="middle" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="11">Telegram</text>
      <text x="68" y="35" text-anchor="middle" fill="#78716c" font-family="system-ui, sans-serif" font-size="9">Voice + Text</text>
    </g>
    
    <!-- Discord -->
    <g transform="translate(15, 165)">
      <rect x="0" y="0" width="110" height="50" rx="8" fill="#2a2a2f" stroke="#3d3d44" stroke-dasharray="4,2"/>
      <!-- Discord official logo -->
      <g transform="translate(10, 13)">
        <circle cx="12" cy="12" r="10" fill="#5865F2"/>
        <g transform="translate(6.5, 6.5) scale(0.45)">
          <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z" fill="#fff"/>
        </g>
      </g>
      <text x="68" y="20" text-anchor="middle" fill="#78716c" font-family="system-ui, sans-serif" font-size="11">Discord</text>
      <text x="68" y="35" text-anchor="middle" fill="#52525b" font-family="system-ui, sans-serif" font-size="9">Coming soon</text>
    </g>
    
    <!-- Slack -->
