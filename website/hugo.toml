baseURL = 'https://magec.dev/'
languageCode = 'en'
title = 'Magec: Self-hosted Multi-Agent AI Platform'
theme = 'magec'

[params]
  description = 'Define multiple AI agents, chain them into workflows, connect tools. Voice, Telegram, webhooks, cron. Your server, your rules.'
  github = 'https://github.com/achetronic/magec'

[markup]
