  <circle cx="920" cy="560" r="1.2" fill="#3d3d44" opacity="0.5"/>
  <circle cx="880" cy="50" r="1" fill="#3d3d44" opacity="0.3"/>
  <circle cx="60" cy="560" r="1" fill="#3d3d44" opacity="0.3"/>

