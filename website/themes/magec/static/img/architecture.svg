      <g transform="translate(12, 12)">
        <circle cx="12" cy="12" r="10" fill="#f59e0b" opacity="0.15"/>
        <circle cx="12" cy="12" r="7" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.6"/>
